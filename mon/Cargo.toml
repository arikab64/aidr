[package]
name = "mon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
signal-hook = "0.4.4"
libbpf-rs = "0.26"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

